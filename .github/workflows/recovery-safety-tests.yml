name: recovery-safety-tests
on:
  push:
    paths:
      - app.js
      - index.html
      - order-client.js
      - order-config.js
      - backend-song.*
      - order-legacy-recovery.js
      - review/**
      - recovery.html
      - private-song.html
      - private-song.js
      - scripts/order_workflow.py
      - scripts/notification_provider.py
      - scripts/private_audio.py
      - scripts/forge_order.py
      - .github/workflows/anthemsmith-order.yml
      - scripts/photo_intake.py
      - tests/**
      - .github/workflows/recovery-safety-tests.yml
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test image and audio tools
        run: |
          python -m pip install Pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Offline safety regressions (no credentials or live customer calls)
        run: python tests/run_offline.py
      - name: Install browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/anthem-review" --no-audit --no-fund --ignore-scripts jsdom@26.1.0
          echo "JSDOM_PATH=$RUNNER_TEMP/anthem-review/node_modules/jsdom" >> "$GITHUB_ENV"
      - name: Existing songs, order form and Stripe returns (offline fixtures)
        run: |
          node --check app.js
          node --check order-client.js
          node --test tests/*.test.mjs
          node review/run-tests.cjs
