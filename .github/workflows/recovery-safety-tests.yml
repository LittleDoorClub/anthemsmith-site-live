name: recovery-safety-tests
on:
  push:
    paths:
      - app.js
      - scripts/order_workflow.py
      - scripts/notification_provider.py
      - scripts/photo_intake.py
      - tests/**
      - .github/workflows/recovery-safety-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test image and audio tools
        run: |
          python -m pip install Pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Offline safety regressions (no credentials or live customer calls)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Existing-song browser-boundary regressions (offline fixtures)
        run: |
          node --check app.js
          node --test tests/player-failure.test.mjs tests/player-review.test.mjs
