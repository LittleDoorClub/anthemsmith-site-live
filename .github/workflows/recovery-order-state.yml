name: recovery-order-state
run-name: recovery-order-state read-only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  state:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read recovery order shape (no writes, no personal data)
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/recovery_order_state.py
      - name: Keep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order-state-evidence
          path: order-state.json
          if-no-files-found: ignore
          retention-days: 7
