name: seed-alex-order
# The seed hand for AS-TEST-ALEX-20261111 — runs scripts/seed_alex_order.py
# inside the Actions env, the one place SUPABASE_SERVICE_ROLE_KEY and the
# vision keys live. Mirrors seed-test-order.yml plus the analyses enforcer:
# anthemsmith_recovery_analyses must cover every uploaded object before the
# forge's prepare() gate will pass (law 2026-11-10).
on:
  workflow_dispatch: {}
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image decode dependency
        run: python -m pip install Pillow --quiet
      # Service-role is the only DDL hand in this house; safe-deploy is its door.
      # Idempotent: a correctly-shaped table is one read and no writes.
      - name: Ensure the private order store exists (analyses + compositions)
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/ensure_private_store.py
      - name: Seed the canonical ALEX order (uploads + vision rows)
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/seed_alex_order.py
