name: recovery-restore-original
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: recovery-restore-AS-MUIJ11B6
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore original private context; no payment or send
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/recovery_restore_original.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-restore-evidence
          path: restore-evidence.json
          if-no-files-found: ignore
          retention-days: 7
