name: bind-payment-one-shot
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bind:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bind verified payment to the configured recovery order
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHEMSMITH_LEGACY_PAYMENT_REF: ${{ secrets.ANTHEMSMITH_LEGACY_PAYMENT_REF }}
          ANTHEMSMITH_LEGACY_ORDER_ID: ${{ secrets.ANTHEMSMITH_LEGACY_ORDER_ID }}
        run: python scripts/bind_payment_one_shot.py