name: recovery-canary
run-name: recovery-canary ${{ inputs.order_id }} ${{ inputs.action }}
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Bounded synthetic operation; never payment, music or messages'
        type: choice
        required: true
        options: [seed, status, analyze, revoke, reservation-test]
      order_id:
        description: 'AS-OX-CANARY-* synthetic namespace only'
        type: string
        required: true
      token_sha256:
        description: 'SHA256 only for seed; NEVER a raw upload capability'
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: recovery-canary-${{ inputs.order_id }}
  cancel-in-progress: false
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image decoder
        run: python -m pip install Pillow --quiet
      - name: Execute bounded synthetic ledger check
        if: inputs.action != 'analyze'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/recovery_canary.py
      - name: Inspect synthetic stored image only when explicitly requested
        if: inputs.action == 'analyze'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/recovery_canary.py
      - name: Keep synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-canary-${{ inputs.order_id }}-${{ inputs.action }}
          path: |
            canary-evidence.json
            canary-network-evidence.json
          if-no-files-found: ignore
          retention-days: 7
