name: anthemsmith-order

on:
  repository_dispatch:
    types: [anthemsmith-order]
  workflow_dispatch:

permissions:
  contents: write

# One active run per order; a retry never cancels an active forge.
concurrency:
  group: anthemsmith-order-${{ github.event.client_payload.order_id || github.event.client_payload.order.order_id || github.run_id }}
  cancel-in-progress: false

jobs:
  relay-paused:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Public relay remains disabled
        run: |
          echo 'Public ntfy payment claims are not trusted. Polling and automatic dispatch remain disabled.'
          echo 'Only a verified private recovery record can authorize an order. Checkout stays paused.'

  forge:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify canonical private order, payment, source and contact
        id: prepare
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/order_workflow.py prepare

      - name: Install audio and image tools
        if: steps.prepare.outputs.ready == 'true'
        run: |
          python -m pip install librosa numpy instaloader Pillow --quiet
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Forge from durable private photos
        id: forge
        if: steps.prepare.outputs.ready == 'true'
        env:
          MUAPI_KEY: ${{ secrets.MUAPI_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/order_workflow.py forge

      - name: Publish audio or blocked/failed status even when forge fails
        id: publish_audio
        if: always() && steps.prepare.outputs.valid_order == 'true'
        env:
          ORDER_ID: ${{ steps.prepare.outputs.order_id }}
          ORDER_PREPARED: ${{ steps.prepare.outputs.ready }}
          FORGE_OUTCOME: ${{ steps.forge.outcome }}
        run: python scripts/order_workflow.py publish

      - name: Deliver only after audio has been published
        id: delivery
        if: always() && !cancelled() && steps.prepare.outputs.ready == 'true' && steps.forge.outputs.audio_ready == 'true' && steps.publish_audio.outcome == 'success'
        env:
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          GABE_CC: ${{ secrets.GABE_CC }}
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/order_workflow.py deliver

      - name: Publish notification outcome even when notification fails
        id: publish_delivery
        if: always() && steps.prepare.outputs.valid_order == 'true'
        env:
          ORDER_ID: ${{ steps.prepare.outputs.order_id }}
          ORDER_PREPARED: ${{ steps.prepare.outputs.ready }}
          FORGE_OUTCOME: ${{ steps.forge.outcome }}
        run: python scripts/order_workflow.py publish

      - name: Remove runner-only private order payload
        if: always()
        run: python scripts/order_workflow.py cleanup
